approach_manager:
  ros__parameters:
    target_frame: "base_nav"
    odom_frame:   "odom"
    edge_enable_service_name: "/approach/edge_detector/set_enable"

    tol_x:              0.03   # m
    tol_theta:          0.08   # rad (~4.5°)
    dwell_duration_sec: 1.0   # 정착 확인 시간 (멈추는 데 ~0.2s). 2.0→1.0; 깔끔하면 0.5까지 더 낮춤 가능
    align_timeout_sec:  5.0
    pc_timeout_sec:     3.0    # fresh PC x가 이 시간 없으면 종료 판정 (끊김 더 버티게 2.0→3.0)
    x_hold_sec:         0.4    # 짧은 invalid 버스트는 직전 유효 x로 메워 끊김 방지 (< pc_timeout_sec)
    theta_timeout_sec:  0.5    # 신선한 yaw가 이 시간 없으면 θ명령=0 (stale 값으로 계속 회전 방지)

    # 대회용 종료 정책: 포기 시점(PC/align timeout)에 아래 둘만 fail, 그 외엔 성공.
    yaw_fail_deg:       20.0   # 마지막 yaw가 이 이상 틀어져 있으면 fail
    x_fail_dist:        0.10   # x를 잃을 때 |x_error|가 이 이상(=멀리서 잃음)이면 fail
    x_converged_hold_sec: 0.5  # x 허용범위가 연속으로 유지돼야 상태 전환
    debug_log:          true

    trail_min_dist: 0.03       # m
    trail_min_yaw:  0.052      # rad (~3°)
