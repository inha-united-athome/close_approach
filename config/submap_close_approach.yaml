submap_close_approach_perception_node:
  ros__parameters:
    input_cloud_topic: "/approach/submap_point"
    target_frame: "base_nav"
    error_topic: "/close_approach/error"
    preprocessed_cloud_topic: "/close_approach/preprocessed_cloud"
    selected_cluster_topic: "/close_approach/selected_cluster"
    front_band_topic: "/close_approach/front_band_cloud"
    marker_topic: "/close_approach/markers"

    max_cloud_age_sec: 0.6

    roi_x_min: 0.20
    roi_x_max: 2.00
    roi_y_abs_max_acquire: 0.80
    roi_y_abs_max_track: 0.45
    roi_z_min: -0.20
    roi_z_max: 1.50

    ground_remove_enable: true
    ground_z_max: 0.08

    statistical_remove_enable: true
    mean_k: 20
    stddev_mul_thresh: 1.0

    radius_remove_enable: false
    radius_search: 0.08
    min_neighbors: 2

    cluster_tolerance_xy: 0.15
    min_cluster_size: 20
    max_cluster_size: 8000
    min_cluster_width: 0.08
    min_cluster_depth: 0.04

    front_percentile: 0.07
    front_band_width: 0.15
    desired_distance: 0.45
    align_front_weight: 0.60

    score_weight_y: 2.0
    score_weight_x: 0.5
    score_weight_area: 0.3
    score_weight_locked_jump: 2.0

    filter_alpha_far: 0.25
    filter_alpha_near: 0.08
    freeze_distance_margin: 0.10
    jump_reject_distance: 0.30
    lost_frame_threshold: 5
    lock_frame_threshold: 2

submap_close_approach_controller_node:
  ros__parameters:
    error_topic: "/close_approach/error"
    cmd_vel_topic: "/cmd_vel"
    enable_control: true
    use_lateral_control: true
    stop_on_invalid: true

    kp_x: 0.25
    kp_y: 1.0
    kp_theta: 1.2

    max_vx: 0.10
    max_vy: 0.08
    max_wz: 0.20
    min_confidence: 0.0

    tol_x: 0.05
    tol_y: 0.04
    tol_theta: 0.08
    dwell_duration_sec: 1.0
    watchdog_timeout_sec: 0.5
