pc_detector:
  ros__parameters:
    cloud_topic:  "/camera/camera_head/depth/color/points"
    lidar_topic:  "/livox/lidar"
    info_topic:   "/camera/camera_head/color/camera_info"
    target_frame: "base_nav"
    odom_frame:   "odom"

    roi_x_min:    0.1
    roi_x_max:    3.0
    roi_y_abs_near: 0.3
    roi_y_abs_max: 0.8
    roi_z_max:    1.5

    leaf_size:           0.03
    mean_k:              50
    stddev_mul_thresh:   0.5
    ground_height:       0.1
    cluster_tolerance:   0.05
    min_cluster_size:    100
    max_cluster_size:    10000
    min_cluster_area:    0.09

    target_standoff_distance: 0.3

    # 선택된 target cluster를 XY로 투영한 뒤, 로봇에 가까운 전면 5%의
    # median x만 종방향 오차로 사용한다. y 오차는 항상 0이다.
    front_slice_ratio: 0.05
    front_min_points:  5
    x_ema_alpha:       0.80  # 새 측정값 비중; 1.0이면 EMA 비활성
    spike_dx_max:      0.15

    max_consecutive_outliers: 5
    lidar_max_age_sec:       0.3
    debug_log:               true
